name: untitled2
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  sqflite: ^2.4.4
  sqlite3_flutter_libs: ^0.6.0+eol
  sqflite_common_ffi: ^2.4.3
  cupertino_icons: ^1.0.8
  mobile_scanner: ^7.4.2
  mailer: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/store_logo.png
flutter_native_splash:
  color: "#071426"
  image: assets/store_logo.png
  android: true
  ios: true
  web: true
  fullscreen: false

  android_12:
    color: "#071426"
    image: assets/store_logo.png
    icon_background_color: "#071426"

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/store_logo.png"
  min_sdk_android: 21
  remove_alpha_ios: true
